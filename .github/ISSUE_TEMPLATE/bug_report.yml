name: Bug report
description: Report a reproducible problem in Marquee
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include API keys, database URLs, private media paths, or vulnerability details.
        Use the security policy for sensitive reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, commit SHA, or branch and date.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Bare-metal development
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Run …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, tokens, private paths, and personal media details.
          required: true
        - label: I searched for an existing report of this problem.
          required: true

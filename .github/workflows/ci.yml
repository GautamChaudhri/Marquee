name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # A throwaway database server for the db-marked tests. Its credentials exist only on
    # the runner, for the length of the job; they are not secrets.
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: marquee
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: marquee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marquee -d marquee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUNBUFFERED: "1"
      # The test fixture creates and drops marquee_test_* databases on this server, and
      # fails rather than skips when it cannot reach it.
      MARQUEE_TEST_DATABASE_URL: postgresql+psycopg://marquee:ci-throwaway@127.0.0.1:5432/marquee
      # The pg_client-marked tests run the real pg_dump, pg_restore, and psql, and fail rather
      # than skip when they are missing.
      MARQUEE_TEST_PG_CLIENT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system libraries
        # PaddleOCR requires the full OpenCV build, which links against libGL.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1

      - name: Install the PostgreSQL 19 client
        # The database server's major version, from the PostgreSQL project's own apt
        # repository (postgresql.org/download/linux/ubuntu): the runner's own client is older,
        # and a dump needs a client as new as the server. The key's fingerprint is checked
        # before apt trusts it.
        run: |
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o "$key" --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-key --with-colons "$key" | grep -q '^fpr:*B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:'
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" 'Architectures: amd64' 'Components: main' \
            "Signed-By: $key" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-19
          echo /usr/lib/postgresql/19/bin >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install dependencies
        # The CPU extra: no GPU here. The lockfile must be current.
        run: uv sync --locked --extra cpu --group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Layering contracts
        run: uv run --no-sync lint-imports

      - name: API schema is current
        # The web app's types are generated from frontend/openapi.json.
        run: uv run --no-sync marquee api-schema --check

      - name: Tests
        # No GPU and no model files on the runner; the database tests use the service above.
        run: uv run --no-sync pytest -rsxX -m "not gpu and not models"

  frontend:
    name: Frontend (Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Runs `prepare`, which generates the API types from frontend/openapi.json.
        run: npm ci

      - name: API types
        run: npm run api:types

      - name: Type check
        run: npm run check

      - name: Lint and format
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        # The built app against the fake backend in e2e/; no real API, key, or library.
        run: npm run test:e2e

  docker:
    name: Compose file and images
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compose file is valid with .env.example
        # Compose reads .env as the stack's settings; the example must keep the file valid.
        # Without a profile only the database starts, as development expects.
        run: |
          cp .env.example .env
          docker compose version
          docker compose config --quiet
          docker compose --profile app --profile tools config --quiet
          test "$(docker compose config --services)" = "db"

      - name: Build the web image
        run: docker build -t marquee:web frontend

      - name: Smoke test the web image
        # It starts with a throwaway key and no API behind it, and its sign-in page answers.
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 \
            -e ORIGIN=http://127.0.0.1:3000 -e MARQUEE_API_URL=http://127.0.0.1:9 \
            -e MARQUEE_API_KEY=ci-throwaway marquee:web
          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/signin) || true
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs web
          docker rm -f web
          test "$code" = 200

      - name: Build the runtime image (CPU build)
        # The NVIDIA image is 18 GB, more than a hosted runner can build. The same Dockerfile
        # with the cpu extra checks everything else the image does; it exists for CI only.
        run: docker build --target runtime --build-arg MARQUEE_EXTRA=cpu -t marquee:runtime .

      - name: Smoke test the runtime image
        run: |
          docker image ls marquee:runtime
          docker run --rm marquee:runtime id
          test "$(docker run --rm marquee:runtime id -u)" != 0
          docker run --rm marquee:runtime marquee --help > /dev/null
          docker run --rm marquee:runtime pg_dump --version | tee /dev/stderr | grep -Eq ' 19(\.|$| )'
          docker run --rm marquee:runtime sh -c 'test ! -e /src'

      - name: The stack starts from the images CI built
        # db, migrate, api, and web from a throwaway settings file made from .env.example (no
        # worker: it needs a GPU). The API's health check passes, and a sign-in through the
        # web app (a form post, as a browser sends it: 303 and a session cookie) followed by a
        # request to /api/system answers 200. The password and key are made here and never
        # printed.
        run: |
          cp .env.example .env
          key=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          password=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          mkdir -p data library
          sudo chown 1000:1000 data
          sed -i -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${password}|" \
            -e "s|^API_KEY=.*|API_KEY=${key}|" \
            -e "s|^MOVIE_LIBRARY_HOST_PATH=.*|MOVIE_LIBRARY_HOST_PATH=${PWD}/library|" \
            -e "s|^MOVIE_ROOTS=.*|MOVIE_ROOTS=${PWD}/library|" \
            -e "s|^MARQUEE_WEB_ORIGIN=.*|MARQUEE_WEB_ORIGIN=http://127.0.0.1:3000|" \
            -e "s|^MARQUEE_WEB_BIND=.*|MARQUEE_WEB_BIND=127.0.0.1|" .env
          docker compose --profile app up -d --no-build db migrate api web
          health=starting
          for attempt in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --profile app ps -q api)")
            [ "$health" = healthy ] && break
            sleep 2
          done
          docker compose --profile app ps
          echo "api: $health"
          signin=000
          for attempt in $(seq 1 30); do
            signin=$(curl -s -o /dev/null -w '%{http_code}' -c cookies.txt -X POST \
              http://127.0.0.1:3000/signin -H 'Origin: http://127.0.0.1:3000' \
              -H 'Accept: text/html' -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "key=${key}") || true
            [ "$signin" = 303 ] && break
            sleep 1
          done
          system=$(curl -s -o system.json -w '%{http_code}' -b cookies.txt \
            http://127.0.0.1:3000/api/system) || true
          echo "sign-in: $signin; /api/system: $system"
          python3 -c "import json; d = json.load(open('system.json')); print('schema', d['schema'], 'environment', d['environment'])" || true
          docker compose --profile app logs --no-color
          docker compose --profile app down -v
          test "$health" = healthy
          test "$signin" = 303
          test "$system" = 200

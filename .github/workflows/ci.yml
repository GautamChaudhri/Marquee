name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes / branch pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    # Health-checked PostgreSQL service with isolated, non-production credentials.
    # conftest provisions ephemeral `test_<uuid>` schemas inside it and drops
    # them; a few suites also create and drop their own disposable databases,
    # which is why the service role is a superuser.
    services:
      postgres:
        # Matches the Compose stack and the runner's own pg_dump/pg_restore
        # major version — the backup suite shells out to them, and libpq
        # refuses a client older than the server.
        image: postgres:16
        env:
          POSTGRES_USER: marquee_ci
          POSTGRES_PASSWORD: marquee_ci_password
          POSTGRES_DB: marquee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marquee_ci -d marquee_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      # DEBUG bypasses the API-key gate exactly as the local suite does; auth is
      # covered explicitly by test_auth.py. No production secret is present.
      DEBUG: "true"
      # Point every Marquee/Alembic/PgQueuer connection at the disposable CI
      # service database. No operator data can be reached.
      DB_URL: postgresql+asyncpg://marquee_ci:marquee_ci_password@127.0.0.1:5432/marquee_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system libraries
        # opencv-python links against libGL; the backup suite shells out to
        # pg_dump/pg_restore from the distribution's PostgreSQL client.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 postgresql-client

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The suite needs no GPU, no model weights, and none of the heavy ML
        # extras: torch, PaddleOCR, transformers and UMAP are imported lazily
        # and are exercised on the GPU host, not here. Installing only
        # [dev,cpu] keeps this job at ~1 minute instead of ~10.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cpu]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Ruff lint
        run: ruff check marquee tests scripts

      - name: Ruff format
        run: ruff format --check marquee tests scripts

      - name: Fresh schema + PgQueuer durable install/verify
        run: python -m marquee.db_migration

      - name: Alembic model/migration equivalence
        run: alembic check

      - name: Backend tests
        run: >-
          pytest -q -rsxX
          --cov=marquee
          --cov-report=term-missing:skip-covered
          --cov-fail-under=70
          --junitxml=backend-junit.xml

      - name: OpenAPI schema is current
        run: python scripts/export_openapi.py --check

      - name: Upload test report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-report-py${{ matrix.python-version }}
          path: backend-junit.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated OpenAPI TypeScript client is current
        run: |
          npx openapi-typescript ../design/api-schema.json -o src/lib/api/generated/openapi.ts
          npx prettier --write src/lib/api/generated/openapi.ts
          git diff --exit-code -- src/lib/api/generated/openapi.ts

      - name: svelte-check (zero errors and zero warnings)
        run: |
          npx svelte-kit sync
          npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: Lint and format check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run bundle:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright + axe)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

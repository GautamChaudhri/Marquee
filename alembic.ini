# Alembic configuration file.
# Generated by Bob the Builder for Marquee v0.1.0

[alembic]
# Path to the migration scripts directory
script_location = alembic

# SQLAlchemy database URL — reads from environment / config
# The env.py file overrides this at runtime, so this is a fallback.
sqlalchemy.url = sqlite+aiosqlite:///./data/marquee.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

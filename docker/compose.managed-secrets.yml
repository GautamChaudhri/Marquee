# Opt in after creating a 0600 keyring outside the repository. The API can
# then replace/test credentials. Workers decrypt once; contained runners receive
# only the one operation-scoped value they need over bounded stdin.
services:
  marquee-api:
    environment:
      MARQUEE_SETTINGS_KEYRING_FILE: /run/secrets/marquee_settings_keyring
    secrets:
      - source: postgres_password
        target: postgres_password
        uid: "0"
        gid: "0"
        mode: 0400
      - source: marquee_api_key
        target: marquee_api_key
        uid: "0"
        gid: "0"
        mode: 0400
      - source: marquee_settings_keyring
        target: marquee_settings_keyring
        uid: "0"
        gid: "0"
        mode: 0400

  marquee-worker:
    environment:
      MARQUEE_SETTINGS_KEYRING_FILE: /run/secrets/marquee_settings_keyring
    secrets:
      - source: postgres_password
        target: postgres_password
        uid: "0"
        gid: "0"
        mode: 0400
      - source: marquee_settings_keyring
        target: marquee_settings_keyring
        uid: "0"
        gid: "0"
        mode: 0400

secrets:
  marquee_settings_keyring:
    file: ${MARQUEE_SETTINGS_KEYRING_PATH:?set MARQUEE_SETTINGS_KEYRING_PATH}

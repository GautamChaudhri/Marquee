# PostgreSQL is the sole source of truth.  API, workers, and scheduler are
# deliberately separate so a slow encode or model run never occupies Uvicorn.
x-marquee-environment: &marquee-environment
  DB_URL: postgresql+asyncpg://marquee:${POSTGRES_PASSWORD:-marquee-dev-change-me}@postgres:5432/marquee
  MARQUEE_ENVIRONMENT: ${MARQUEE_ENVIRONMENT:-production}
  MARQUEE_PROCESS_ROLE: api
  EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-auto}
  JOB_EMBEDDED_WORKERS: "false"

x-marquee: &marquee
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      MARQUEE_HW: ${MARQUEE_HW:-cpu}
  image: marquee:${MARQUEE_HW:-cpu}
  env_file:
    - ../.env
  environment:
    <<: *marquee-environment
    # Dedicated marquee-worker / marquee-scheduler services run the job runtime,
    # so the API must NOT spawn its own embedded workers.  (Only the API process
    # reads this flag; worker/scheduler/migrate ignore it.)
    JOB_EMBEDDED_WORKERS: "false"
  volumes:
    - marquee-data:/app/data
    - ../marquee/ml/models:/app/marquee/ml/models:ro
    # Media libraries must be mounted into both API (read-only UI access) and
    # workers (read/write operations).  Add site-specific mounts here.
    # - /mnt/media/movies:/movies
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marquee
      POSTGRES_USER: marquee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marquee-dev-change-me}
    volumes:
      - marquee-postgres:/var/lib/postgresql/data
    ports:
      # Lets a locally-run `uvicorn` connect without exposing PostgreSQL to
      # the LAN. Containers continue to use the internal `postgres` hostname.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquee -d marquee"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *marquee
    command: ["python", "-m", "marquee.db_migration"]
    environment:
      <<: *marquee-environment
      MARQUEE_PROCESS_ROLE: migration
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  marquee-api:
    <<: *marquee
    command: ["uvicorn", "marquee.main:app", "--host", "0.0.0.0", "--port", "3165", "--no-access-log"]
    ports:
      - "3165:3165"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3165/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  marquee-worker:
    <<: *marquee
    command: ["python", "-m", "marquee.core.jobs.pgqueuer_worker"]
    environment:
      <<: *marquee-environment
      MARQUEE_PROCESS_ROLE: worker
    # For NVIDIA deployments add the compose GPU reservation here.  Keeping it
    # off API/scheduler is intentional: only workers own accelerator work.

  marquee-scheduler:
    <<: *marquee
    command: ["python", "-m", "marquee.core.jobs.pgqueuer_scheduler"]
    environment:
      <<: *marquee-environment
      MARQUEE_PROCESS_ROLE: scheduler

volumes:
  marquee-data:
  marquee-postgres:

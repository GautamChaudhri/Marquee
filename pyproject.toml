[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marquee"
version = "0.1.0"
description = "AI-powered automatic poster finder for Plex/Jellyfin media servers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Gautam", email = "" }
]
keywords = ["media", "posters", "plex", "jellyfin", "radarr", "sonarr", "ai", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Data validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    # HTTP
    "httpx>=0.28,<1.0",
    # Image processing
    "Pillow>=12.2,<13.0",
    "imagehash>=4.3,<5.0",
    "opencv-python>=4.8,<5.0",
    # AI / ML (Phase 3+)
    "numpy>=1.24,<3.0",
    # macOS always gets the universal package (CoreML + CPU providers).
    # On Linux, pick exactly ONE accelerator extra: [cpu], [nvidia], or [intel]
    # — the three onnxruntime packages install the same module and conflict.
    "onnxruntime>=1.19,<2.0; sys_platform == 'darwin'",
    # Utilities
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
    # Subtitle management (design 03). System media tools are installed through
    # the OS package manager; these are the lightweight Python parsing pieces.
    "pysubs2>=1.6,<2.0",
    "langcodes>=3.4,<4.0",
    "language_data>=1.2,<2.0",
    "charset-normalizer>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.28,<1.0",       # for TestClient
    "ruff>=0.9,<1.0",
    "tqdm>=4.65,<5.0",
]

# --- Pick exactly one accelerator extra on Linux ------------------------
# CPU-only hosts (Intel N150 and friends):       pip install -e ".[cpu]"
# NVIDIA GPUs (RTX 3070, 3060, ...):             pip install -e ".[nvidia]"
# Intel iGPU / Arc dGPU (A310, UHD via OpenVINO): pip install -e ".[intel]"
# Apple Silicon needs no extra (CoreML ships in the base onnxruntime).
cpu = [
    "onnxruntime>=1.19,<2.0",
]
nvidia = [
    "onnxruntime-gpu>=1.19,<2.0",
]
intel = [
    "onnxruntime-openvino>=1.19,<2.0",
]

ml = [
    # OCR runtime + model-export tooling. PaddleOCR is required to run the
    # pipeline; torch/transformers are only needed to export models
    # (CLIP, DINOv2, zero-shot axes). The YOLO person model is exported once
    # with the `ultralytics` package (not a runtime dep — install ad hoc):
    #   yolo export model=yolo11n.pt format=onnx dynamic=True
    # Linux NVIDIA: pip install paddlepaddle-gpu==3.3.1 -i https://www.paddlepaddle.org.cn/packages/stable/cu126/
    "paddlepaddle>=3.0; sys_platform == 'darwin'",
    "paddleocr>=3.0",
    "onnx>=1.16",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "tqdm>=4.65",
]

# Taste-map visualization (design 11). UMAP gives meaningful projections +
# HDBSCAN clustering; without it the API falls back to a numpy-SVD PCA with
# no clustering. umap-learn pulls scikit-learn (HDBSCAN lives there too), so
# this adds no packages beyond umap-learn itself.
viz = [
    "umap-learn>=0.5.7",
    "scikit-learn>=1.5",
]

# Subtitle management (design 03). Text-subtitle parsing/preview/validation,
# language-tag normalization + display names, and legacy-encoding detection.
# System tools (ffmpeg, ffprobe, mkvtoolnix) are NOT pip-installable — install
# them via the OS package manager (see the feature's install notes).
subtitles = [
    # Kept as a named extra for scripts/docs that already use .[subtitles].
    # The deps are in the base install because subtitle routes import at app startup.
]

all = [
    "marquee[dev,ml,viz,subtitles]",
]

[tool.hatch.build.targets.wheel]
packages = ["marquee"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

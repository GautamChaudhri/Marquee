[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marquee"
dynamic = ["version"]
description = "Poster artwork selection for Radarr movie libraries"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Gautam Chaudhri" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pillow>=12.2,<14.0",
    "imagehash>=4.3,<5.0",
    # The OpenCV build PaddleOCR's pipeline insists on (it checks for this exact
    # distribution). It needs the system libGL.so.1 even though nothing opens a window.
    "opencv-contrib-python==4.10.0.84",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psutil>=5.9,<8.0",
    "tqdm>=4.65,<5.0",
    # The version the engine's OCR rules were tuned against; newer releases change
    # the default recognition model.
    "paddleocr==3.6.0",
    "psycopg[binary]>=3.2,<4.0",
    # The HTTP API (marquee.api, the only package allowed to import it).
    "fastapi>=0.115,<1.0",
]

[project.optional-dependencies]
# Pick exactly one: the GPU and CPU builds install the same modules and conflict.
cpu = [
    "onnxruntime==1.26.0",
    "paddlepaddle==3.3.1",
]
nvidia = [
    # ONNX Runtime built against CUDA 12.8 and cuDNN 9 (needed for Blackwell cards).
    # CUDA and cuDNN come from the nvidia-*-cu12 wheels; PaddlePaddle pins their versions.
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
    # CUDA 12.9 build, served from PaddlePaddle's own index (see tool.uv.sources).
    "paddlepaddle-gpu==3.3.1",
    "nvidia-ml-py>=13.0,<14.0",
]

[project.scripts]
marquee = "marquee.cli:main"

[project.urls]
Repository = "https://github.com/GautamChaudhri/Marquee"

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff==0.17.6",
    "import-linter>=2.17,<3.0",
]
# Used only by `marquee models fetch` to export and build models; no runtime code imports
# them. Install with `uv sync --extra nvidia --group export`. PyTorch is the CPU build, so
# the only CUDA libraries in the environment stay the ones PaddlePaddle pins.
export = [
    "torch==2.15.0",
    "transformers==5.24.0",
    "onnx==1.23.2",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "nvidia" }]]
# Marquee runs on Linux x86_64 (this machine, CI, and later the containers).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# PaddlePaddle's index serves wheels whose dependencies differ by platform, and uv reads
# only one wheel's metadata. State the linux x86_64 wheel's requirements (copied from its
# METADATA) so the CUDA wheels it pins are locked.
[[tool.uv.dependency-metadata]]
name = "paddlepaddle-gpu"
version = "3.3.1"
requires-dist = [
    "httpx",
    "numpy>=1.21",
    "protobuf>=3.20.2",
    "Pillow",
    "opt_einsum==3.3.0",
    "networkx",
    "typing_extensions",
    "safetensors>=0.6.0",
    'setuptools; python_version >= "3.12"',
    'nvidia-cuda-nvrtc-cu12==12.9.41; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cuda-runtime-cu12==12.9.37; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cuda-cupti-cu12==12.9.19; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cudnn-cu12==9.9.0.52; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cublas-cu12==12.9.0.13; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cufft-cu12==11.4.0.6; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-curand-cu12==10.3.10.19; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cusolver-cu12==11.7.4.40; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cusparse-cu12==12.5.9.5; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cusparselt-cu12==0.7.1; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-nccl-cu12==2.27.3; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-nvtx-cu12==12.9.19; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-nvjitlink-cu12==12.9.41; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cufile-cu12==1.14.0.30; platform_system == "Linux" and platform_machine == "x86_64"',
    'cuda-python==12.9.4; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cuda-cccl-cu12==12.9.27; platform_system == "Linux" and platform_machine == "x86_64"',
]

[tool.hatch.version]
path = "marquee/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["marquee"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_salvage"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
# PaddlePaddle warns on import when the ccache compiler cache is absent; irrelevant here.
filterwarnings = ["ignore:No ccache found:UserWarning"]
markers = [
    "models: needs model files under data/models; skipped when they are absent",
    "gpu: needs a CUDA GPU",
    "db: needs the Compose Postgres database",
]

# Layering (see docs/architecture.md). Imports only point downward. Packages that do not
# exist yet (db, artwork, jobs) join their layer when they arrive.
[tool.importlinter]
root_package = "marquee"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers only import downward"
type = "layers"
layers = [
    "marquee.api : marquee.cli : marquee.doctor : marquee.model_fetch",
    "marquee.taste",
    "marquee.library",
    "marquee.pipeline",
    "marquee.ml",
    "marquee.fs | marquee.integrations",
    "marquee.config | marquee.logging | marquee.cancellation | marquee.host_metrics",
]

[[tool.importlinter.contracts]]
name = "The engine does not know a database exists"
type = "forbidden"
source_modules = ["marquee.ml", "marquee.pipeline"]
forbidden_modules = ["sqlalchemy", "asyncpg", "psycopg"]

[[tool.importlinter.contracts]]
name = "Only marquee.config reads settings from the environment"
type = "forbidden"
source_modules = [
    "marquee.api",
    "marquee.cli",
    "marquee.doctor",
    "marquee.model_fetch",
    "marquee.taste",
    "marquee.library",
    "marquee.pipeline",
    "marquee.ml",
    "marquee.fs",
    "marquee.integrations",
    "marquee.logging",
    "marquee.cancellation",
    "marquee.host_metrics",
]
forbidden_modules = ["dotenv", "pydantic_settings"]
# Reaching settings through marquee.config is the point; only direct imports are banned.
# Reads of os.environ cannot be expressed as an import contract; they are kept in
# marquee.config by review (other modules only set variables PaddlePaddle reads).
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only marquee.api imports a web framework"
type = "forbidden"
source_modules = [
    "marquee.cli",
    "marquee.doctor",
    "marquee.model_fetch",
    "marquee.taste",
    "marquee.library",
    "marquee.pipeline",
    "marquee.ml",
    "marquee.fs",
    "marquee.integrations",
    "marquee.config",
    "marquee.logging",
    "marquee.cancellation",
    "marquee.host_metrics",
]
forbidden_modules = ["fastapi", "starlette"]
# The CLI starts the API, so it reaches FastAPI through marquee.api; only direct imports
# are banned.
allow_indirect_imports = true

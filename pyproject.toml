[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marquee"
dynamic = ["version"]
description = "AI-powered poster management for Radarr and Sonarr media libraries"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Gautam Chaudhri" }
]
keywords = [
    "media",
    "posters",
    "plex",
    "jellyfin",
    "radarr",
    "sonarr",
    "tmdb",
    "computer-vision",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    # Web framework. Pinned <0.137: fastapi 0.137 replaced flattened
    # include_router() with lazy `_IncludedRouter` wrappers, changing the
    # `app.routes` introspection the route-ordering tests rely on. The app is
    # certified against the 0.136.x line.
    "fastapi>=0.140.13,<0.141",
    "uvicorn[standard]>=0.32,<1.0",
    # Data validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pgqueuer==1.1.1",
    # HTTP
    "httpx>=0.28,<1.0",
    # Image processing
    "Pillow>=12.2,<13.0",
    "imagehash>=4.3,<5.0",
    "opencv-python>=4.8,<5.0",
    # AI / ML (Phase 3+)
    "numpy>=1.24,<3.0",
    # macOS always gets the universal package (CoreML + CPU providers).
    # On Linux, pick exactly ONE accelerator extra: [cpu], [nvidia], or [intel]
    # — the three onnxruntime packages install the same module and conflict.
    "onnxruntime>=1.19,<2.0; sys_platform == 'darwin'",
    # Utilities
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
    # Host telemetry for the dashboard (CPU/RAM/disk/uptime). GPU metrics use
    # nvidia-ml-py, which ships in the [nvidia] extra.
    "psutil>=5.9,<8.0",
]

[project.urls]
Homepage = "https://github.com/GautamChaudhri/Marquee"
Repository = "https://github.com/GautamChaudhri/Marquee"
Issues = "https://github.com/GautamChaudhri/Marquee/issues"
Documentation = "https://github.com/GautamChaudhri/Marquee#readme"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.28,<1.0",       # for TestClient
    # Formatting is a CI contract; pin it so a formatter release cannot make
    # an otherwise unchanged branch fail. Dependabot proposes upgrades.
    "ruff==0.15.17",
    "tqdm>=4.65,<5.0",
]

# --- Pick exactly one accelerator extra on Linux ------------------------
# CPU-only hosts (Intel N150 and friends):       pip install -e ".[cpu]"
# NVIDIA GPUs (RTX 3070, 3060, ...):             pip install -e ".[nvidia]"
# Intel iGPU / Arc dGPU (A310, UHD via OpenVINO): pip install -e ".[intel]"
# Apple Silicon needs no extra (CoreML ships in the base onnxruntime).
cpu = [
    "onnxruntime>=1.19,<2.0",
]
nvidia = [
    "onnxruntime-gpu>=1.19,<2.0",
    # NVML bindings for dashboard GPU metrics (util/VRAM/temp/power/enc).
    "nvidia-ml-py>=12.0,<13.0",
]
intel = [
    "onnxruntime-openvino>=1.19,<2.0",
]

ml = [
    # OCR runtime + model-export tooling. PaddleOCR is required to run the
    # pipeline; torch/transformers are only needed to export models
    # (CLIP, DINOv2, zero-shot axes). The YOLO person model is exported once
    # with the `ultralytics` package (not a runtime dep — install ad hoc):
    #   yolo export model=yolo11n.pt format=onnx dynamic=True
    # Linux NVIDIA: pip install paddlepaddle-gpu==3.3.1 -i https://www.paddlepaddle.org.cn/packages/stable/cu126/
    "paddlepaddle>=3.0; sys_platform == 'darwin'",
    "paddleocr>=3.0",
    "onnx>=1.16",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "tqdm>=4.65",
]

# Taste-map visualization (design 11). UMAP gives meaningful projections +
# HDBSCAN clustering; without it the API falls back to a numpy-SVD PCA with
# no clustering. umap-learn pulls scikit-learn (HDBSCAN lives there too), so
# this adds no packages beyond umap-learn itself.
viz = [
    "umap-learn>=0.5.7",
    "scikit-learn>=1.5",
]

all = [
    "marquee[dev,ml,viz]",
]

[tool.hatch.build.targets.wheel]
packages = ["marquee"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.version]
path = "marquee/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "marquee/alembic"
"alembic.ini" = "marquee/alembic.ini"

[tool.hatch.build.targets.sdist]
include = [
    "/alembic",
    "/alembic.ini",
    "/marquee",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

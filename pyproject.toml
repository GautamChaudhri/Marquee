[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marquee"
version = "0.1.0"
description = "AI-powered automatic poster finder for Plex/Jellyfin media servers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Gautam", email = "" }
]
keywords = ["media", "posters", "plex", "jellyfin", "radarr", "sonarr", "ai", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Data validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    # HTTP
    "httpx>=0.28,<1.0",
    # Image processing
    "Pillow>=10.0,<12.0",
    "imagehash>=4.3,<5.0",
    "opencv-python>=4.8,<5.0",
    # AI / ML (Phase 3+)
    "numpy>=1.24,<3.0",
    "onnxruntime>=1.19,<2.0",
    # "paddlepaddle>=3.0",       # uncomment in Phase 3
    # "paddleocr>=2.9",           # uncomment in Phase 3
    # "onnxruntime>=1.19",        # uncomment in Phase 3
    # "onnx>=1.16",               # uncomment in Phase 3 (export only)
    # Utilities
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.28,<1.0",       # for TestClient
    "ruff>=0.9,<1.0",
]

ml = [
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
    "onnx>=1.16",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "tqdm>=4.65",
]

all = [
    "marquee[dev,ml]",
]

[tool.hatch.build.targets.wheel]
packages = ["marquee"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

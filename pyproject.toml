[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marquee"
dynamic = ["version"]
description = "Poster artwork selection for Radarr and Sonarr media libraries"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Gautam Chaudhri" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pillow>=12.2,<14.0",
    "imagehash>=4.3,<5.0",
    # Headless: nothing opens a window, and it needs no system GL libraries.
    "opencv-python-headless>=4.10,<5.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psutil>=5.9,<8.0",
    "tqdm>=4.65,<5.0",
    "paddleocr>=3.7,<3.8",
    "psycopg[binary]>=3.2,<4.0",
    # marquee.fs.boundary builds streaming file responses with it.
    "fastapi>=0.115,<1.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime==1.26.0",
    "paddlepaddle==3.3.1",
]

[project.scripts]
marquee = "marquee.cli:main"

[project.urls]
Repository = "https://github.com/GautamChaudhri/Marquee"

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff==0.17.6",
    "import-linter>=2.17,<3.0",
]

[tool.uv]
# PaddleOCR depends on the GUI build of OpenCV (opencv-contrib-python), which
# installs the same cv2 module as opencv-python-headless and needs system GL
# libraries. Drop it so exactly one OpenCV build is installed: the headless one.
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

[tool.hatch.version]
path = "marquee/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["marquee"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_salvage"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "models: needs model files under data/models; skipped when they are absent",
    "gpu: needs a CUDA GPU",
    "db: needs the Compose Postgres database",
]

# Marquee's Compose file: the database for development, and the whole product as a stack.
#
#   docker compose up -d                   only the database (development: the app runs on
#                                          the host and talks to it on 127.0.0.1)
#   docker compose --profile app up -d     the stack: database, migration, API, worker, web
#
# A production .env sets COMPOSE_PROFILES=app, so there `docker compose up -d` starts the
# stack. The one-command containers sit behind the "tools" profile; `docker compose run`
# starts them whatever the profile:
#
#   docker compose run --rm setup                      fetch and build the models
#   docker compose run --rm marquee marquee doctor     any marquee command, once
#
# Every setting comes from .env (see .env.example). The application containers read no .env
# file themselves (MARQUEE_ENV_FILE is empty): Compose passes the settings, overriding the
# ones that differ inside a container. The web container gets only its own six.

x-app-image: &app-image
  image: marquee:runtime
  build:
    context: .
    target: runtime
    args: &app-build-args
      # The container user's ids. They must own the data folder and be able to write the
      # library; 1000 is the first user on most Linux machines.
      MARQUEE_UID: "1000"
      MARQUEE_GID: "1000"

# What every application container is told, beyond .env.
x-app-environment: &app-environment
  MARQUEE_ENVIRONMENT: production
  MARQUEE_ENV_FILE: ""
  DATA_DIR: /data
  MOVIE_ROOTS: /media/movies
  POSTGRES_HOST: db
  # Inside the stack the database always listens on 5432; POSTGRES_PORT in .env is the
  # port it is published on, on the host.
  POSTGRES_PORT: "5432"

# Docker's json-file driver keeps every line a container prints unless told otherwise. Each
# service keeps at most five files of 10 MB.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  db:
    <<: *logging
    image: postgres:19
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot: brings the database schema to the newest migration, then exits. The API and
  # the worker start only after it has succeeded.
  migrate:
    <<: [*app-image, *logging]
    profiles: ["app"]
    command: ["marquee", "db", "upgrade"]
    env_file: .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*app-image, *logging]
    profiles: ["app"]
    command: ["marquee", "api"]
    env_file: .env
    environment:
      <<: *app-environment
      MARQUEE_ROLE: api
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    # Not published: only the web container talks to it, inside the stack. To reach it from
    # the host itself, uncomment this (loopback only; it still needs the key):
    # ports:
    #   - "127.0.0.1:8000:8000"
    volumes:
      # Thumbnails are cached in the data folder, so it is writable here too.
      - ${MARQUEE_DATA_HOST_PATH:-./data}:/data
      - ${MOVIE_LIBRARY_HOST_PATH:?set MOVIE_LIBRARY_HOST_PATH in .env}:/media/movies:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; its Python asks the API's own readiness probe. A 503 raises.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  worker:
    <<: [*app-image, *gpu, *logging]
    profiles: ["app"]
    command: ["marquee", "worker"]
    env_file: .env
    environment:
      <<: *app-environment
      MARQUEE_ROLE: worker
    volumes:
      - ${MARQUEE_DATA_HOST_PATH:-./data}:/data
      # Read-write: the worker writes posters into the movie folders, always backing up the
      # poster it replaces.
      - ${MOVIE_LIBRARY_HOST_PATH:?set MOVIE_LIBRARY_HOST_PATH in .env}:/media/movies
    # The worker kills its GPU child and OCR processes when it stops; as PID 1 nothing would
    # reap them.
    init: true
    # On SIGTERM it signals cancel, waits up to 10 s, puts unfinished jobs back, and stops
    # the GPU child; give it time to do all of that before Docker kills it.
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy only while a worker holds the queue's lock and the database answers.
      test: ["CMD", "marquee", "worker", "--health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped

  web:
    <<: *logging
    image: marquee:web
    build:
      context: frontend
    profiles: ["app"]
    # The browser's address is required: without it every form post is refused. It is
    # checked here rather than with ${...:?} so that `docker compose up -d` for development
    # (the database alone) works without it.
    command:
      - sh
      - -c
      - >-
        [ -n "$$ORIGIN" ] || { echo "marquee web: set MARQUEE_WEB_ORIGIN in .env to the
        address your browser uses, for example http://marquee.example.lan:3000" >&2; exit 1; };
        exec node build
    # No env_file: the web server holds the API key and nothing else secret.
    environment:
      MARQUEE_API_URL: http://api:8000
      MARQUEE_API_KEY: ${API_KEY:-}
      ORIGIN: ${MARQUEE_WEB_ORIGIN:-}
      HOST: 0.0.0.0
      PORT: "3000"
      # The proxy refuses bodies over 1 MiB itself; the server's default limit (512 KiB) would
      # cut them first, with a 502.
      BODY_SIZE_LIMIT: 1M
    ports:
      - "${MARQUEE_WEB_BIND:-0.0.0.0}:${MARQUEE_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/signin').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  # One-shot, on demand: builds or fetches every missing model into the data folder and
  # writes its checksum manifest. The export image carries the tools the runtime lacks.
  setup:
    <<: [*gpu, *logging]
    image: marquee:export
    build:
      context: .
      target: export
      args: *app-build-args
    profiles: ["tools"]
    command: ["marquee", "models", "fetch"]
    env_file: .env
    environment:
      <<: *app-environment
    volumes:
      - ${MARQUEE_DATA_HOST_PATH:-./data}:/data

  # Any marquee command, once: `docker compose run --rm marquee marquee <command>`.
  marquee:
    <<: [*app-image, *gpu, *logging]
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *app-environment
    volumes:
      - ${MARQUEE_DATA_HOST_PATH:-./data}:/data
      - ${MOVIE_LIBRARY_HOST_PATH:?set MOVIE_LIBRARY_HOST_PATH in .env}:/media/movies:ro

volumes:
  db-data:
